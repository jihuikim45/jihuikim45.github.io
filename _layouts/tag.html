---
layout: default
---

<div class="tag-page">
  <h1>{{ page.tag }}</h1>

  <div class="tag-posts">
{% for post in site.posts %}
      {% if post.tags contains page.tag %}
        <div class="post-card">
          <a href="{{ post.url | relative_url }}">
            <h2>{{ post.title }}</h2>
            <p>{{ post.description | default: post.excerpt | strip_html | truncate: 80 }}</p>
            <span class="post-date">{{ post.date | date: "%B %d, %Y" }}</span>
          </a>
        </div>
      {% endif %}
    {% endfor %}
  </div>
</div>
